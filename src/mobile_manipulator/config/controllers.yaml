controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster: {type: joint_state_broadcaster/JointStateBroadcaster}
    base_controller: {type: diff_drive_controller/DiffDriveController}
    arm_controller: {type: joint_trajectory_controller/JointTrajectoryController}
base_controller:
  ros__parameters:
    left_wheel_names: [front_left_joint, rear_left_joint]
    right_wheel_names: [front_right_joint, rear_right_joint]
    wheel_separation: 0.60
    wheel_radius: 0.115
    publish_rate: 50.0
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    cmd_vel_timeout: 0.5
arm_controller:
  ros__parameters:
    joints: [arm_base_yaw, shoulder_pitch, elbow_pitch, wrist_pitch, left_finger_joint, right_finger_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
